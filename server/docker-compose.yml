# Local Postgres for development and the server suite (spec §4.4); the image CI uses (plan 7).
name: wordado
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: wordado
      POSTGRES_PASSWORD: wordado
      POSTGRES_DB: wordado
    # Local data needs no durability; these settings make the suite faster.
    command: ['postgres', '-c', 'fsync=off', '-c', 'synchronous_commit=off', '-c', 'full_page_writes=off']
    ports:
      - '54329:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wordado -d wordado']
      interval: 1s
      timeout: 3s
      retries: 30
    volumes:
      # Postgres 18 images keep their data under /var/lib/postgresql/18/docker.
      - pgdata:/var/lib/postgresql
volumes:
  pgdata:
