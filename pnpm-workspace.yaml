packages:
  - core
  - pipeline
  - client-data
  - server
  - web

# esbuild (via tsx, vitest and wrangler) and workerd (via wrangler) run from their
# optional platform packages; their postinstall scripts are not needed.
allowBuilds:
  esbuild: false
  workerd: false

minimumReleaseAgeExclude:
  - '@journeyapps/wa-sqlite@2.0.6'
